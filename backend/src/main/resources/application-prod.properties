# Production Database Configuration (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Production Settings
# Use 'update' for first deployment, switch to 'validate' after schema is finalized
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=WARN
logging.level.com.thecandletales=INFO

# JWT
jwt.expiration=86400000

# Error Handling - hide stack traces and internal messages
server.error.include-stacktrace=never
server.error.include-message=never
